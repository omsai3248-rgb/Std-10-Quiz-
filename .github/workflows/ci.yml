name: Build Web & Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK as a GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci

      - name: Lint web & security rules
        run: npm run lint

      - name: Build web bundle & sync Android assets
        run: npm run android:sync

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Android SDK 36 & accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: 'basic'

      - name: Prepare debug signing keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Debug APK
        run: gradle :app:assembleDebug --no-daemon --max-workers=2 --stacktrace

      - name: Build Android Release APK
        run: gradle :app:assembleRelease -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease --no-daemon --max-workers=2 --stacktrace

      - name: Stage APK outputs
        run: |
          mkdir -p build-artifacts
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/Std10-Quiz-debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-artifacts/Std10-Quiz-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/Std10-Quiz-release-unsigned.apk
          fi
          ls -lh build-artifacts/

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: std10-quiz-android-apk
          path: build-artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Web dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: std10-quiz-web-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release (on tag or manual trigger)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$TAG" build-artifacts/*.apk \
            --title "Std 10 Quiz Android App ($TAG)" \
            --notes "Automated Android APK & Web Portal build from commit ${GITHUB_SHA::7}." \
            --latest
