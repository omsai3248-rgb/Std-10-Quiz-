    <script>
      (function () {
        if (window.location.hostname === 'appassets.androidplatform.net') {
          try {
            if ('serviceWorker' in navigator && navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {

              window.caches.keys().then(function (keys) {

        function showBootError(detail) {
          if (window.__QQ_APP_MOUNTED__) return;
          var msg = document.getElementById('qq-boot-msg');
          var btn = document.getElementById('qq-boot-retry');
          if (msg) {
            msg.textContent = 'એપ લોડ થવામાં સમસ્યા આવી. કૃપા કરીને Reload દબાવો.' + (detail ? ' (' + detail + ')' : '');
          }
          if (btn) btn.style.display = 'inline-block';
        }
        window.addEventListener('error', function (ev) {
          if (!window.__QQ_APP_MOUNTED__) {
            showBootError(ev && ev.message ? String(ev.message).slice(0, 120) : '');
          }
        });
        window.addEventListener('unhandledrejection', function (ev) {
          if (!window.__QQ_APP_MOUNTED__) {
            var reason = ev && ev.reason ? (ev.reason.message || String(ev.reason)) : '';
            showBootError(String(reason).slice(0, 120));
          }
        });
        setTimeout(function () {
          if (!window.__QQ_APP_MOUNTED__) {
            var btn = document.getElementById('qq-boot-retry');
            if (btn) btn.style.display = 'inline-block';
          }
        }, 7000);
      })();
